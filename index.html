  <style>
    /* --- 1. Grundeinstellungen & Typografie --- */
    :root {
      --bg-color: #0f172a;       /* Dunkles Blau-Grau */
      --card-bg: #1e293b;        /* Karten-Hintergrund */
      --text-main: #e2e8f0;      /* Textfarbe */
      --accent-color: #38bdf8;   /* Neon Blau */
      --accent-glow: 0 0 10px rgba(56, 189, 248, 0.5);
      --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      color: var(--accent-color);
      text-shadow: var(--accent-glow);
      font-weight: 300;
      border-bottom: 1px solid var(--accent-color);
      display: inline-block;
      padding-bottom: 10px;
      left: 50%;
      position: relative;
      transform: translateX(-50%);
    }

    /* --- 2. Das Raster (Grid) Layout --- */
    .dashboard-grid {
      display: grid;
      /* Mindestens 350px breit, sonst füllen */
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* --- 3. Karten-Design --- */
    .cam-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .cam-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7), var(--accent-glow);
      border-color: var(--accent-color);
    }

    .cam-header {
      padding: 15px;
      background: rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cam-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .cam-header a {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s;
    }

    .cam-header a:hover {
      color: #fff;
      text-shadow: var(--accent-glow);
    }

    .status-dot {
      height: 8px;
      width: 8px;
      background-color: #10b981; /* Grün */
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 5px #10b981;
    }

    /* --- 4. Medien Container --- */
    .media-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; 
      background-color: #000;
      overflow: hidden;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- 5. Spezial-Hacks --- */

    /* SCALE HACK: Für Roundshot/Webseiten, zoomt heraus */
    .scale-hack iframe {
      width: 200%;
      height: 200%;
      transform: scale(0.5);
      transform-origin: 0 0;
    }

    /* CROP HACK: Für Grimsel, schiebt Header weg */
    .crop-header iframe {
      top: -250px !important; 
      height: calc(100% + 250px) !important; 
      position: absolute;
      left: 0;
    }

    /* --- 6. Mobile Anpassung --- */
    @media (max-width: 600px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
    }
  </style>
</head>
