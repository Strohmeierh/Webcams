name: METAR LSZK aktualisieren

on:
  schedule:
    - cron: '5 * * * *'   # jede Stunde um :05
  workflow_dispatch:

jobs:
  fetch-metar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: METAR LSZK herunterladen
        run: |
          # Mehrere Quellen versuchen
          STATUS=0

          # Quelle 1: aviationweather.gov - LSMD (Dübendorf, 8.6km von LSZK)
          # LSZK veröffentlicht kein eigenes METAR
          curl -s --max-time 15 \
            -A "Mozilla/5.0 (compatible; LSZK-Dashboard/1.0)" \
            -H "Accept: application/json" \
            -o metar-lszk.json \
            "https://aviationweather.gov/api/data/metar?ids=LSMD&format=json" || STATUS=$?

          # Prüfen ob Inhalt gültig (nicht leer, enthält LSMD)
          if [ -s metar-lszk.json ] && grep -q "LSMD" metar-lszk.json; then
            echo "Quelle 1 (aviationweather.gov/LSMD) erfolgreich"
          else
            echo "Quelle 1 fehlgeschlagen, versuche Quelle 2..."
            # Quelle 2: NOAA text METAR für LSMD
            RAW=$(curl -s --max-time 15 \
              "https://tgftp.nws.noaa.gov/data/observations/metar/stations/LSMD.TXT")
            if [ -n "$RAW" ] && echo "$RAW" | grep -q "LSMD"; then
              METAR=$(echo "$RAW" | tail -1)
              DATE=$(echo "$RAW" | head -1)
              echo "[{\"rawOb\":\"$METAR\",\"reportTime\":\"$DATE\"}]" > metar-lszk.json
              echo "Quelle 2 (NOAA text/LSMD) erfolgreich: $METAR"
            else
              echo "Beide Quellen fehlgeschlagen"
              exit 1
            fi
          fi

          echo "Finaler Inhalt:"
          cat metar-lszk.json

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metar-lszk.json
          git diff --staged --quiet && echo "Keine Änderung" || \
            git commit -m "METAR LSZK: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
